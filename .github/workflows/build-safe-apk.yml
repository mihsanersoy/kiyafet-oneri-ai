name: OptiWear Güvenli Android APK Derleyici & Release

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android-apk:
    name: Güvenli & İmzalı Android APK Üret
    runs-on: ubuntu-24.04

    steps:
      - name: Repo Kodlarını Çek
        uses: actions/checkout@v4

      - name: Java 17 Kurulumu
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Flutter SDK (3.24.5 Stable) Kurulumu
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: 'stable'
          cache: true

      - name: Android İskeletini, Desugaring ve Güvenlik Yapılandırmasını Hazırla
        working-directory: ./mobile
        run: |
          cp -r lib /tmp/optiwear_lib_backup
          cp pubspec.yaml /tmp/optiwear_pubspec_backup.yaml
          cp android/app/src/main/AndroidManifest.xml /tmp/AndroidManifest.xml
          cp android/app/src/main/res/xml/network_security_config.xml /tmp/network_security_config.xml

          rm -rf android
          flutter create . --platforms=android --org app.optiwear --project-name optiwear_mobile

          rm -rf lib test
          cp -r /tmp/optiwear_lib_backup lib
          cp /tmp/optiwear_pubspec_backup.yaml pubspec.yaml

          mkdir -p android/app/src/main/res/xml android/app/src/main/res/raw assets/images
          cp /tmp/AndroidManifest.xml android/app/src/main/AndroidManifest.xml
          cp /tmp/network_security_config.xml android/app/src/main/res/xml/network_security_config.xml
          cp assets/sounds/routine_alert.mp3 android/app/src/main/res/raw/routine_alert.mp3
          cp assets/sounds/weather_shift_alert.mp3 android/app/src/main/res/raw/weather_shift_alert.mp3
          if [ -f "../public/logo.png" ]; then
            cp ../public/logo.png assets/images/logo.png
          fi

          # OptiWear logosunu Android uygulama ikonu olarak yerleştir
          if [ -f "../public/logo.png" ]; then
            for dir in android/app/src/main/res/mipmap-*; do
              if [ -d "$dir" ]; then
                cp ../public/logo.png "$dir/ic_launcher.png"
              fi
            done
          fi

          # flutter_local_notifications için Core Library Desugaring ve SDK 34 yapılandırması
          cat << 'EOF' > android/app/build.gradle
          plugins {
              id "com.android.application"
              id "kotlin-android"
              id "dev.flutter.flutter-gradle-plugin"
          }

          android {
              namespace = "app.optiwear.optiwear_mobile"
              compileSdk = 34
              ndkVersion = flutter.ndkVersion

              compileOptions {
                  coreLibraryDesugaringEnabled true
                  sourceCompatibility = JavaVersion.VERSION_1_8
                  targetCompatibility = JavaVersion.VERSION_1_8
              }

              kotlinOptions {
                  jvmTarget = "1.8"
              }

              defaultConfig {
                  applicationId = "app.optiwear.optiwear_mobile"
                  minSdk = 21
                  targetSdk = 34
                  versionCode = 5
                  versionName = "1.2.2"
                  multiDexEnabled true
              }

              buildTypes {
                  release {
                      signingConfig = signingConfigs.debug
                      minifyEnabled false
                      shrinkResources false
                  }
              }
          }

          flutter {
              source = "../.."
          }

          dependencies {
              coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.0.4'
          }
          EOF

      - name: Paketleri Yükle ve Release APK Derle
        working-directory: ./mobile
        run: |
          flutter pub get
          flutter build apk --release --no-tree-shake-icons
          cp build/app/outputs/flutter-apk/app-release.apk build/app/outputs/flutter-apk/OptiWear-Guvenli-Release.apk

      - name: İndirilebilir Güvenli APK Dosyasını Actions'a Yükle
        uses: actions/upload-artifact@v4
        with:
          name: OptiWear-Guvenli-Android-APK
          path: mobile/build/app/outputs/flutter-apk/OptiWear-Guvenli-Release.apk
          retention-days: 30

      - name: Git Tag Pushlandığında Otomatik GitHub Release ve APK Yayınla
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: mobile/build/app/outputs/flutter-apk/OptiWear-Guvenli-Release.apk
          generate_release_notes: true
